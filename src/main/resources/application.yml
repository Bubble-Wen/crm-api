spring:
  application:
    name: crm-api
  profiles:
    active: dev
  mvc:
    path-match:
      matching-strategy: ant_path_matcher #解决
  mail:
    host: smtp.qq.com
    port: 587
    username: 2933128731@qq.com  # 发送方邮箱
    password: nbsifsoabmpldeab  # QQ邮箱SMTP授权码（不是登录密码）
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  type-aliases-package: com.crm.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: true # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)

server:
  port: 8081
  servlet:
    context-path: /crm-api

logging:
  config: classpath:log/logback-spring.xml

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.crm.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: Soft_root

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:   # 如果没有密码，可以不写或写成空字符串

    language: zh-CN
  basic:
    enable: true    #开启密码模式
    username: admin   #用户名
    password: 123456  #密码

auth:
  ignore_urls:
    - /sys/auth/**
    - /actuator/**
    - /v3/api-docs/**
    - /webjars/**
    - /swagger/**
    - /swagger-resources/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /doc.html
    - /
    - /department/**
    - /customer/**
    - /product/**
    - /common/**
    - /contract/**
    # 根路径

