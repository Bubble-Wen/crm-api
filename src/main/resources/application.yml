spring:
  application:
    name: crm-api
  profiles:
    active: dev
  mvc:
    path-match:
      matching-strategy: ant_path_matcher # 解决路径匹配问题
  # 数据库配置（归到 spring 下，正确缩进）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crm_db?useSSL=false&allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  # Redis配置（归到 spring 下，正确缩进）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:   # 无密码留空即可
  # 邮件配置（关键：归到 spring 下，层级正确）
  mail:
    host: smtp.qq.com
    port: 587
    username: 2933128731@qq.com  # 发送者QQ邮箱
    password: nbsifsoabmpldeab   # QQ邮箱SMTP授权码（不是登录密码）
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# mybatis-plus配置（保持不变）
mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  type-aliases-package: com.crm.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: true # 全局逻辑删除字段名（since 3.3.0）
      logic-delete-value: 1 # 逻辑已删除值（默认1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认0）

# 服务器配置（保持不变）
server:
  port: 8081
  servlet:
    context-path: /crm-api

# 日志配置（保持不变）
logging:
  config: classpath:log/logback-spring.xml

# springdoc-openapi配置（保持不变）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.crm.controller

# knife4j配置（修复缩进，独立于spring）
knife4j:
  enable: true
  setting:
    language: zh-CN # 修复缩进：归到 setting 下
  basic:
    enable: true    # 开启密码模式
    username: admin # 登录用户名
    password: 123456 # 登录密码

# 权限忽略路径（保持不变）
auth:
  ignore_urls:
    - /sys/auth/**
    - /actuator/**
    - /v3/api-docs/**
    - /webjars/**
    - /swagger/**
    - /swagger-resources/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /doc.html
    - /
    - /department/**
    - /customer/**
    - /product/**
    - /common/**
    - /contract/**

